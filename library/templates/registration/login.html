{% extends 'library/base.html' %}{% block content %}<div class="login-card card"><h1>Вход в систему</h1><p class="muted">Для демонстрации используйте учетные записи из README.</p><form method="post">{% csrf_token %}<div class="field"><label>Логин</label><input class="form-control" type="text" name="username" autofocus required></div><div class="field"><label>Пароль</label><input class="form-control" type="password" name="password" required></div>{% if form.errors %}<div class="alert error">Неверный логин или пароль.</div>{% endif %}<button class="btn blue full">Войти</button></form></div>{% endblock %}
