{% extends 'library/base.html' %}
{% block title %}Регистрация — АИС Библиотека{% endblock %}
{% block content %}
<div class="login-card card"><h1>Регистрация</h1><p class="muted">Создание учетной записи читателя.</p><form method="post">{% csrf_token %}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for e in field.errors %}<div class="error">{{ e }}</div>{% endfor %}</div>{% endfor %}<button class="btn blue full">Зарегистрироваться</button></form></div>
{% endblock %}
